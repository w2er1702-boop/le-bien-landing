<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#06182B"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A961"/>
      <stop offset="50%" stop-color="#E5C880"/>
      <stop offset="100%" stop-color="#C9A961"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative gold rule -->
  <rect x="120" y="180" width="80" height="3" fill="url(#goldShine)"/>

  <!-- subtitle -->
  <text x="120" y="240" font-family="Georgia, 'Playfair Display', serif" font-size="26" fill="#C9A961" letter-spacing="6">
    SELECTED · PREMIUM · TRUSTED
  </text>

  <!-- main wordmark -->
  <text x="120" y="380" font-family="Georgia, 'Playfair Display', serif" font-size="180" font-weight="700" fill="url(#goldShine)" letter-spacing="-2">
    Le Bien
  </text>

  <!-- korean tagline -->
  <text x="120" y="455" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="36" fill="#FFFFFF" letter-spacing="2">
    르비엔 — 좋은 것만 모으다
  </text>

  <!-- bottom row: categories -->
  <text x="120" y="540" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="22" fill="#9AA7B8" letter-spacing="1">
    뷰티 · 건강기능식품 · 생활용품 · 주방용품
  </text>

  <!-- frame corners -->
  <g stroke="#C9A961" stroke-width="2" fill="none">
    <path d="M40 40 L80 40 M40 40 L40 80"/>
    <path d="M1160 40 L1120 40 M1160 40 L1160 80"/>
    <path d="M40 590 L80 590 M40 590 L40 550"/>
    <path d="M1160 590 L1120 590 M1160 590 L1160 550"/>
  </g>
</svg>
