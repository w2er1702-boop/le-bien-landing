<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="../js/base.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A2540" />
  <title>로그인 — 르비엔 Le Bien</title>
  <meta name="description" content="르비엔 멤버스 로그인. 회원가 적용·쿠폰 확인을 위해 로그인하세요." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="로그인 — 르비엔 Le Bien" />
  <meta property="og:description" content="르비엔 멤버스 로그인." />
  <meta property="og:image" content="assets/og-image.svg" />
  <meta property="og:url" content="https://w2er1702-boop.github.io/le-bien-landing/account/login.html" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A2540'/%3E%3Ctext x='32' y='44' font-family='Georgia, serif' font-size='32' font-weight='700' fill='%23C9A961' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div data-include="partials/header.html"></div>

  <main class="formwrap">
    <div class="container">
      <div class="formwrap__inner">
        <h1 class="formwrap__title">로그인</h1>
        <p class="formwrap__sub">르비엔 멤버스에 오신 것을 환영합니다.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="login-email">이메일 <span class="req" aria-hidden="true">*</span></label>
            <input class="input" type="email" id="login-email" name="email" required autocomplete="email" placeholder="you@example.com" />
            <span class="field__err" id="login-email-err" hidden>이메일 형식이 올바르지 않습니다.</span>
          </div>
          <div class="field">
            <label for="login-pw">비밀번호 <span class="req" aria-hidden="true">*</span></label>
            <input class="input" type="password" id="login-pw" name="password" required minlength="4" autocomplete="current-password" placeholder="비밀번호" />
            <span class="field__err" id="login-pw-err" hidden>비밀번호를 입력해 주세요.</span>
          </div>
          <div class="field" style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">
            <label class="check"><input type="checkbox" checked /> 자동 로그인</label>
            <a href="#" style="color:var(--color-text-sub);" onclick="event.preventDefault(); alert('데모 사이트 — 비밀번호 재설정은 준비 중입니다.');">비밀번호 찾기</a>
          </div>
          <button type="submit" class="btn btn--primary">로그인</button>
        </form>

        <div class="formwrap__divider"><span>또는 SNS 계정으로 로그인</span></div>
        <div class="formwrap__sns">
          <button class="sns--kakao" type="button" onclick="alert('데모 사이트 — SNS 로그인은 준비 중입니다.');">카카오</button>
          <button class="sns--naver" type="button" onclick="alert('데모 사이트 — SNS 로그인은 준비 중입니다.');">네이버</button>
          <button class="sns--google" type="button" onclick="alert('데모 사이트 — SNS 로그인은 준비 중입니다.');">Google</button>
        </div>

        <div class="formwrap__links">
          <a href="account/signup.html">회원가입</a>
          <span aria-hidden="true">·</span>
          <a href="account/orders.html">비회원 주문조회</a>
        </div>

        <p style="margin-top:18px;padding:10px 12px;background:var(--color-bg-soft);font-size:12px;color:var(--color-text-sub);border-radius:var(--radius);text-align:center;">
          데모 사이트입니다. <strong>비밀번호는 4자 이상</strong>이면 어떤 값이든 로그인이 됩니다.
        </p>
      </div>
    </div>
  </main>

  <div data-include="partials/footer.html"></div>

  <script src="js/includes.js"></script>
  <script src="js/state.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('login-email').value.trim();
        var pw = document.getElementById('login-pw').value;
        var emailErr = document.getElementById('login-email-err');
        var pwErr = document.getElementById('login-pw-err');
        var okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        var okPw = pw.length >= 4;
        emailErr.hidden = okEmail;
        pwErr.hidden = okPw;
        if (!okEmail || !okPw) return;
        window.LB.user.login(email);
        var next = new URLSearchParams(location.search).get('next');
        location.href = next || 'account/mypage.html';
      });
    })();
  </script>
</body>
</html>
