<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="../js/base.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5B4B9A" />
  <title>제휴·입점 문의 — 르비엔 Le Bien</title>
  <meta name="description" content="르비엔 제휴·입점 문의. 함께 좋은 것을 만들어 갑니다." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="제휴·입점 문의 — 르비엔 Le Bien" />
  <meta property="og:description" content="제휴·입점 문의." />
  <meta property="og:image" content="assets/og-image.svg" />
  <meta property="og:url" content="https://w2er1702-boop.github.io/le-bien-landing/support/partnership.html" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A2540'/%3E%3Ctext x='32' y='44' font-family='Georgia, serif' font-size='32' font-weight='700' fill='%23C9A961' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div data-include="partials/header.html"></div>

  <main class="formwrap">
    <div class="container">
      <div class="formwrap__inner formwrap__inner--wide">
        <h1 class="formwrap__title">제휴·입점 문의</h1>
        <p class="formwrap__sub">르비엔의 셀렉션 기준에 부합하는 브랜드를 기다립니다.</p>

        <form onsubmit="event.preventDefault(); alert('데모 사이트 — 입점 문의가 접수되었습니다.\n실제 운영 시 영업일 기준 3~5일 이내 회신드립니다.'); this.reset();">
          <div class="field--row">
            <div class="field">
              <label for="pt-company">회사명 <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="pt-company" class="input" required />
            </div>
            <div class="field">
              <label for="pt-brand">브랜드명 <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="pt-brand" class="input" required />
            </div>
          </div>
          <div class="field--row">
            <div class="field">
              <label for="pt-name">담당자 <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="pt-name" class="input" required />
            </div>
            <div class="field">
              <label for="pt-position">직책</label>
              <input type="text" id="pt-position" class="input" />
            </div>
          </div>
          <div class="field--row">
            <div class="field">
              <label for="pt-email">이메일 <span class="req" aria-hidden="true">*</span></label>
              <input type="email" id="pt-email" class="input" required />
            </div>
            <div class="field">
              <label for="pt-phone">연락처 <span class="req" aria-hidden="true">*</span></label>
              <input type="tel" id="pt-phone" class="input" required />
            </div>
          </div>
          <div class="field">
            <label for="pt-cat">상품 카테고리 <span class="req" aria-hidden="true">*</span></label>
            <select id="pt-cat" class="select" required>
              <option value="">선택해 주세요</option>
              <option>뷰티</option>
              <option>건강기능식품</option>
              <option>생활용품</option>
              <option>주방용품</option>
              <option>식품·베이커리</option>
              <option>패션·잡화</option>
              <option>기타</option>
            </select>
          </div>
          <div class="field">
            <label for="pt-url">브랜드 홈페이지 또는 SNS</label>
            <input type="url" id="pt-url" class="input" placeholder="https://" />
          </div>
          <div class="field">
            <label for="pt-msg">제안 내용 <span class="req" aria-hidden="true">*</span></label>
            <textarea id="pt-msg" class="textarea" required minlength="20" placeholder="브랜드 소개, 주요 상품, 가격대, 제안하시는 협업 형태 등을 알려 주세요."></textarea>
          </div>
          <label class="check" style="margin-bottom:18px;">
            <input type="checkbox" required /> [필수] 입점 검토를 위한 개인정보·회사정보 수집·이용에 동의합니다.
          </label>
          <button type="submit" class="btn btn--primary">제휴 신청하기</button>
        </form>
      </div>
    </div>
  </main>

  <div data-include="partials/footer.html"></div>

  <script src="js/includes.js"></script>
  <script src="js/state.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
