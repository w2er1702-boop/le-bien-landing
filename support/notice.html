  <meta name="description" content="르비엔 공지사항 상세." />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="공지사항 — 르비엔 Le Bien" />
  <meta property="og:description" content="공지사항 상세." />
  <meta property="og:image" content="assets/og-image.svg" />
  <meta property="og:url" content="https://w2er1702-boop.github.io/le-bien-landing/support/notice.html" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A2540'/%3E%3Ctext x='32' y='44' font-family='Georgia, serif' font-size='32' font-weight='700' fill='%23C9A961' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="pagehero">
      <div class="container">
        <p class="pagehero__crumb"><a href="index.html">홈</a><span class="pagehero__crumb-sep">›</span><a href="support/notices.html">공지사항</a><span class="pagehero__crumb-sep">›</span><span id="nCrumb">상세</span></p>
        <h1 class="pagehero__title" id="nTitle">공지사항</h1>
        <p class="pagehero__sub" id="nMeta"></p>
      </div>
    </section>

    <section class="article">
      <div class="container article__inner">
        <div class="article__body" id="nBody" style="white-space:pre-wrap;"></div>
        <div style="margin-top:36px;display:flex;justify-content:space-between;gap:12px;">
          <a href="support/notices.html" class="btn btn--ghost">목록</a>
          <a href="support/inquiry.html" class="btn btn--gold-outline">관련 문의</a>
        </div>
      </div>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <script src="js/includes.js"></script>
  <script src="js/state.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      function whenReady(fn) {
        var d = new Promise(function (r) { document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r) : r(); });
        Promise.all([d, window.__LB_INCLUDES_READY || Promise.resolve()]).then(fn);
      }
      whenReady(function () {
        var id = parseInt(new URLSearchParams(location.search).get('id') || '0', 10);
        fetch('data/notices.json').then(function (r) { return r.json(); }).then(function (data) {
          var n = data.find(function (x) { return x.id === id; }) || data[0];
          if (!n) {
            document.getElementById('nTitle').textContent = '공지를 찾을 수 없습니다';
            return;
          }
          document.title = n.title + ' — 르비엔';
          document.getElementById('nCrumb').textContent = '#' + n.id;
          document.getElementById('nTitle').textContent = n.title;
          document.getElementById('nMeta').textContent = n.date + ' · ' + n.category + ' · 조회 ' + n.views.toLocaleString('ko-KR');
          document.getElementById('nBody').textContent = n.body;
        });
      });
    })();
  </script>
</body>
</html>
