<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="../js/base.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5B4B9A" />
  <title>공지사항 — 르비엔 Le Bien</title>
  <meta name="description" content="르비엔 공지사항 목록." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="공지사항 — 르비엔 Le Bien" />
  <meta property="og:description" content="공지사항." />
  <meta property="og:image" content="assets/og-image.svg" />
  <meta property="og:url" content="https://w2er1702-boop.github.io/le-bien-landing/support/notices.html" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A2540'/%3E%3Ctext x='32' y='44' font-family='Georgia, serif' font-size='32' font-weight='700' fill='%23C9A961' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="pagehero">
      <div class="container">
        <p class="pagehero__crumb"><a href="index.html">홈</a><span class="pagehero__crumb-sep">›</span>고객지원<span class="pagehero__crumb-sep">›</span>공지사항</p>
        <h1 class="pagehero__title">공지사항</h1>
      </div>
    </section>

    <section class="container" style="padding:32px 0 56px;">
      <table class="boardtable" id="noticesTable">
        <thead><tr>
          <th class="col-num" style="width:60px;">번호</th>
          <th>제목</th>
          <th style="width:110px;">등록일</th>
          <th class="col-views" style="width:80px;">조회</th>
        </tr></thead>
        <tbody id="noticesBody"><tr><td colspan="4" style="padding:40px;color:var(--color-text-sub);">로딩 중...</td></tr></tbody>
      </table>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <script src="js/includes.js"></script>
  <script src="js/state.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      function whenReady(fn) {
        var d = new Promise(function (r) { document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r) : r(); });
        Promise.all([d, window.__LB_INCLUDES_READY || Promise.resolve()]).then(fn);
      }
      whenReady(function () {
        fetch('data/notices.json').then(function (r) { return r.json(); }).then(function (data) {
          var body = document.getElementById('noticesBody');
          body.innerHTML = data.map(function (n) {
            var imp = n.important ? '<span class="badge--notice">필독</span>' : '';
            var cat = '<span class="badge--cat">' + esc(n.category) + '</span>';
            return '<tr>' +
              '<td class="col-num">' + n.id + '</td>' +
              '<td class="title">' + imp + cat + '<a href="support/notice.html?id=' + n.id + '">' + esc(n.title) + '</a></td>' +
              '<td>' + n.date + '</td>' +
              '<td class="col-views">' + n.views.toLocaleString('ko-KR') + '</td>' +
            '</tr>';
          }).join('');
        });
      });
      function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    })();
  </script>
</body>
</html>
