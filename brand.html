<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="js/base.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A2540" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="브랜드관 — 르비엔 Le Bien" />
  <meta property="og:description" content="르비엔이 선별한 브랜드들. Le Bien 자체 라인부터 협력 브랜드까지." />
  <meta property="og:image" content="assets/og-image.svg" />
  <meta property="og:url" content="https://w2er1702-boop.github.io/le-bien-landing/brand.html" />
  <meta property="og:site_name" content="Le Bien" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A2540'/%3E%3Ctext x='32' y='44' font-family='Georgia, serif' font-size='32' font-weight='700' fill='%23C9A961' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page-cat="brand">
  <div data-include="partials/header.html"></div>

  <main>
    <section class="pagehero pagehero--accent">
      <div class="container">
        <p class="pagehero__crumb"><a href="index.html">홈</a><span class="pagehero__crumb-sep">›</span>브랜드관</p>
        <h1 class="pagehero__title">Brand <em>Stories</em></h1>
        <p class="pagehero__sub">Le Bien 자체 브랜드부터 협력 브랜드까지 — 르비엔의 셀렉션 파트너들</p>
      </div>
    </section>

    <section class="container">
      <ul class="brandgrid" id="brandList"></ul>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <script src="js/includes.js"></script>
  <script src="js/state.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      function whenReady(fn) {
        var dom = new Promise(function (r) {
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', r);
          else r();
        });
        Promise.all([dom, window.__LB_INCLUDES_READY || Promise.resolve()]).then(fn);
      }
      whenReady(function () {
        Promise.all([
          fetch('data/brands.json').then(function (r) { return r.json(); }),
          fetch('data/products.json').then(function (r) { return r.json(); })
        ]).then(function (res) {
          var brands = res[0], products = res[1];
          var list = document.getElementById('brandList');
          if (!list) return;
          list.innerHTML = brands.map(function (b) {
            var count = products.filter(function (p) { return (b.matchBrands || []).indexOf(p.brand) !== -1; }).length;
            var initial = (b.name.match(/[A-Za-z]/) ? b.name.charAt(0).toUpperCase() : b.name.charAt(0));
            return '<li><a class="brandcard" href="search.html?q=' + encodeURIComponent(b.matchBrands[0]) + '">' +
              '<span class="brandcard__logo">' + initial + '</span>' +
              '<strong class="brandcard__name">' + b.name + '</strong>' +
              '<span class="brandcard__desc">' + b.tagline + '</span>' +
              '<span class="brandcard__count">상품 ' + count + '개</span>' +
            '</a></li>';
          }).join('');
        });
      });
    })();
  </script>
</body>
</html>
